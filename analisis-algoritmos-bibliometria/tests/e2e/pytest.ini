[pytest]
testpaths = .
addopts = -ra --tb=short
markers =
    modulo1: Similitud textual (R1)
    modulo2: Clustering jerarquico y dendrogramas (R2)
    modulo3: Busqueda de patrones KMP / Rabin-Karp / Boyer-Moore (R3)
    modulo4: Ranking de terminos Counting / Radix / Bucket Sort
    flujo: Flujo integrado de los cuatro modulos
    api: Backend Flask (solo si se define API_URL)